services:
  demo:
    image: go-monitor-local
    pull_policy: never
    entrypoint: ["/demo"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - monitor

  monitor:
    image: go-monitor-local
    build: .
    command: ["-serve", "${MONITOR_TARGET:-http://demo:8081/}"]

  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:12.4.16
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/go-monitor/dashboard.json:ro
